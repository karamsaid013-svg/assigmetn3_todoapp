<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive to-do list app built with vanilla JavaScript and localStorage.">
  <title>Interactive To-Do List</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="app-title">
      <header class="app-header">
        <p class="eyebrow">Assignment 3</p>
        <h1 id="app-title">My To-Do List</h1>
        <p class="subtitle">Add tasks, mark them complete, and keep them saved after refresh.</p>
      </header>

      <form id="task-form" class="task-form" novalidate>
        <label for="task-input" class="sr-only">New task</label>
        <input
          id="task-input"
          name="task"
          type="text"
          maxlength="120"
          autocomplete="off"
          placeholder="What do you need to do?"
          aria-describedby="feedback"
        >
        <button class="add-button" type="submit">Add Task</button>
      </form>

      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>

      <ul id="task-list" class="task-list" aria-label="Task list"></ul>

      <div id="empty-state" class="empty-state">
        <div class="empty-icon" aria-hidden="true">✓</div>
        <h2>No tasks yet</h2>
        <p>Add your first task above to get started.</p>
      </div>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
